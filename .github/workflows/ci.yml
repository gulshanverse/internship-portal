name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/internship_portal?schema=public
      PUBLIC_SITE_URL: https://staging.ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm run db:validate
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Type check
        run: pnpm run lint
      - name: Unit and security tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Whitespace check
        run: git diff --check
